name: ci

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out pinned dependency capsule tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dkta-labs/capsulectl
          ref: 65f68432e968ae52281e9a0bfb15f3d7801e2fc6
          path: .ci-tools/capsulectl
          persist-credentials: false

      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.1"
          cache: false

      - name: Build pinned capsule controller
        working-directory: .ci-tools/capsulectl
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/bin"
          go build -trimpath -o "$RUNNER_TEMP/bin/capsulectl" ./cmd/capsulectl
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Stage symlink-free reviewed capsule source
        run: |
          set -eu
          staged="$RUNNER_TEMP/termenor-capsule-source"
          mkdir -p "$staged"
          tar --dereference \
            --exclude='./.git' \
            --exclude='./.ci-tools' \
            --exclude='./.capsule/state.json' \
            --exclude='./.capsule/intake.cdx.json' \
            -cf - . | tar -xf - -C "$staged"
          printf 'CAPSULE_SPEC=%s\n' "$staged/.capsule/capsule.json" >> "$GITHUB_ENV"

      - name: Intake dependency capsule and compile release targets
        run: capsulectl intake --spec "$CAPSULE_SPEC"

      - name: Verify reviewed source binding
        run: capsulectl check --spec "$CAPSULE_SPEC"

      - name: Test Bun source offline in credential-blind capsule
        run: capsulectl run --spec "$CAPSULE_SPEC"

      - name: Typecheck Bun source offline in credential-blind capsule
        run: capsulectl run --spec "$CAPSULE_SPEC" -- bun run typecheck

      - name: Test restricted SSH gateway
        working-directory: packages/gateway
        run: go test ./...

      - name: Smoke compiled client through username-free stock SSH
        run: |
          set -eu
          smoke_dir="$RUNNER_TEMP/termenor-release-smoke"
          mkdir -p "$smoke_dir"
          capsule_dir=$(dirname "$CAPSULE_SPEC")
          image=$(jq -r .image "$capsule_dir/state.json")
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/capsule-output/termenor-linux-x64" "$smoke_dir/client"
          docker cp "$container:/capsule-output/termenor-server-linux-x64" "$smoke_dir/server"
          docker rm "$container"
          trap - EXIT
          (
            cd packages/gateway
            CGO_ENABLED=0 go build -trimpath -o "$smoke_dir/gateway" .
          )
          python3 scripts/release-smoke.py \
            --server "$smoke_dir/server" \
            --client "$smoke_dir/client" \
            --gateway "$smoke_dir/gateway"
